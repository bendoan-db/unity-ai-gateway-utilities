# Who can use which Unity AI Gateway model services.
# Edit this file, then run the grant_permissions notebook in the same folder.
#
# groups: account-level identity groups. Workspace-local groups can't receive Unity Catalog grants.
# users:  user emails. Service principals can also go here, listed by application ID.
#
# Each entry:
#   name:           group name, user email, or service principal application ID
#   model_services: three-part names (catalog.schema.service) they can access
#   privileges:     optional. Default [EXECUTE]. Applies to every service in the entry.
#
# Privileges you can grant on a model service:
#   EXECUTE         Query the service. Most users need only this.
#   READ_METADATA   View the service's settings and permissions without querying it.
#   APPLY_TAG       Add and edit tags on the service.
#   MANAGE          Change or delete the service and control who can access it. Give it only to
#                   people who administer the service.
#   ALL_PRIVILEGES  Every privilege except MANAGE and READ_METADATA.
# Names can also be written with spaces, e.g. READ METADATA.
# Example: privileges: [EXECUTE, MANAGE]
#
# The notebook also grants USE CATALOG and USE SCHEMA on each service's catalog and schema.
# Access is only added. Removing an entry here doesn't revoke access.

groups:
  - name: poc-admins
    model_services:
      - my_catalog.ai_gateway.poc-kimi-admins
      - my_catalog.ai_gateway.poc-claude-opus-5-5-admins

  - name: poc-developers
    model_services:
      - my_catalog.ai_gateway.poc-claude-opus-5-5-admins

users:
  - name: first.last@example.com
    model_services:
      - my_catalog.ai_gateway.poc-kimi-admins
